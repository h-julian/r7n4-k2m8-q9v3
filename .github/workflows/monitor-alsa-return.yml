name: Monitor ALSA Zamora-Jerez

on:
  workflow_dispatch:
  schedule:
    # Cada cinco minutos, desplazado del inicio de la hora para reducir retrasos.
    - cron: "2-57/5 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: monitor-alsa-zamora-jerez
  cancel-in-progress: false

jobs:
  comprobar:
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Descargar el monitor
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar plazas
        id: monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_1: ${{ secrets.ALERT_EMAIL_1 }}
          ALERT_EMAIL_2: ${{ secrets.ALERT_EMAIL_2 }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          MONITOR_DATES: "2026-08-30,2026-08-31,2026-09-01"
          MONITOR_DEPARTURE_FILTERS: '{"2026-09-01":["02:15"]}'
          MONITOR_STATE_PATH: ".github/alsa-monitor-state.json"
        run: npm run check

      - name: Guardar la memoria si cambia la disponibilidad
        run: |
          if git diff --quiet -- .github/alsa-monitor-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/alsa-monitor-state.json
          git commit -m "Update ALSA availability state"
          git push

      - name: Desactivar cuando hayan pasado las fechas
        if: ${{ steps.monitor.outputs.expired == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable monitor-alsa-return.yml
