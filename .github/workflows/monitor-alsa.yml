name: Monitor ALSA Jerez-Zamora

on:
  workflow_dispatch:
  schedule:
    # Cada cinco minutos, desplazado del inicio de la hora para reducir retrasos.
    - cron: "2-57/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: monitor-alsa-jerez-zamora
  cancel-in-progress: false

jobs:
  comprobar:
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Descargar el monitor
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar plazas
        id: monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_1: ${{ vars.ALERT_EMAIL_1 }}
          ALERT_EMAIL_2: ${{ vars.ALERT_EMAIL_2 }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          MONITOR_DATES: "2026-08-05,2026-08-06"
        run: npm run check

      - name: Desactivar tras avisar o finalizar las fechas
        if: ${{ steps.monitor.outputs.alert_sent == 'true' || steps.monitor.outputs.expired == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable monitor-alsa.yml
